name: AppleTube
# Your signing team and bundle ID live in Local.yml (gitignored): `cp Local.example.yml Local.yml` and fill it in.
include: [Local.yml]
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
targets:
  AppleTube:
    type: application
    platform: iOS
    sources: [AppleTube]
    info:
      path: AppleTube/Resources/Info.plist
      properties:
        CFBundleDisplayName: AppleTube
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APPLETUBE_BUNDLE_ID:default=com.example.AppleTube)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  AppleTubeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppleTubeTests
        excludes: [Fixtures]
      - path: AppleTubeTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: AppleTube
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APPLETUBE_BUNDLE_ID:default=com.example.AppleTube)Tests
  AppleTubeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AppleTubeUITests]
    dependencies:
      - target: AppleTube
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APPLETUBE_BUNDLE_ID:default=com.example.AppleTube)UITests
        TEST_TARGET_NAME: AppleTube
schemes:
  AppleTube:
    build:
      targets:
        AppleTube: all
        AppleTubeTests: [test]
        AppleTubeUITests: [test]
    test:
      targets: [AppleTubeTests, AppleTubeUITests]
