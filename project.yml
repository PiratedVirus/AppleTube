name: AppleTube
options:
  bundleIdPrefix: dev.saurabhk
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: F9KW2XLTZ5   # Personal Team (free): device installs expire after 7 days
    CODE_SIGN_STYLE: Automatic
targets:
  AppleTube:
    type: application
    platform: iOS
    sources: [AppleTube]
    info:
      path: AppleTube/Resources/Info.plist
      properties:
        CFBundleDisplayName: AppleTube
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.saurabhk.AppleTube
        TARGETED_DEVICE_FAMILY: "1"
  AppleTubeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppleTubeTests
        excludes: [Fixtures]
      - path: AppleTubeTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: AppleTube
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.saurabhk.AppleTubeTests
schemes:
  AppleTube:
    build:
      targets:
        AppleTube: all
        AppleTubeTests: [test]
    test:
      targets: [AppleTubeTests]
